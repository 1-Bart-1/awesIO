$schema: http://json-schema.org/draft-07/schema#
$id: structure_schema
title: AWE System Structure Schema
description: >
  Resolved structural definition of an AWE system: the points, the segments,
  stations, pulleys, tethers and winches built on them, the rigid bodies, and
  the tubes between those bodies. Each component carries its own geometry and
  material, so a file is a complete structural definition rather than a
  connectivity sketch.

  Fully resolved and expanded — no variable substitution, no segment counts left
  to expand, every component explicit — so a file is readable with nothing
  beyond a YAML or JSON parser. This is the layer system_schema.yml leaves
  free-form under its wing_sections, bridle_nodes, bridle_lines and
  bridle_connections blocks.

  Every block is a headers/data table and every reference is by name. What a
  block requires is the core: what a viewer and every solver need, and nothing a
  single tool needs. A block may carry columns beyond it, a tool's own among
  them; a reader addresses columns by header, never by position, and ignores a
  column it does not know. An absent optional block means the same as an empty
  one.

  Live state — positions, velocities, forces, twist angles, reel-out — is not
  structure and is not described here. Nor is the placement of CAD geometry into
  the ENU world frame: the same structure flies at any elevation.

type: object
required:
  - metadata
  - points
  - segments

properties:
  metadata:
    type: object
    required:
      - name
      - description
      - note
      - awesIO_version
      - schema
      - n_points
      - connectivity_sha
    properties:
      name:
        type: string
      description:
        type: string
      note:
        type: string
      awesIO_version:
        type: string
        description: Version of this schema the file was written against.
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
      schema:
        type: string
        const: structure_schema.yml
      n_points:
        type: integer
        minimum: 1
        description: Number of rows in the points block.
      connectivity_sha:
        type: string
        description: >
          Lowercase hex SHA-256 of the connectivity, so state recorded against
          one structure is not silently replayed against another that indexes
          differently.

          The preimage is ASCII and built in document order, in two sections:
          the number of points, then each segment's two endpoints as ONE-BASED
          row numbers into the points block; then the number of bodies, then
          each tube's two bodies as one-based row numbers into the bodies
          block. The two numbers of a pair are comma-separated and every field
          ends in a semicolon, so a lone number always opens a section. Three
          points joined in a row, on two bodies joined by one tube, read
          `3;1,2;2,3;2;1,2;`. Row numbers are one-based so that
          implementations in zero-based languages agree with each other; a
          reader that gets this wrong sees every file as a mismatch.
        pattern: '^[0-9a-f]{64}$'
    additionalProperties: false

  # --------------------------------------------------------------------------
  # POINTS AND THE ELEMENTS BUILT ON THEM
  # --------------------------------------------------------------------------
  points:
    description: >
      Mass points. `body` names the rigid body a BODY_STATIC point is fixed to,
      and is null for a point that belongs to no body. `mass` [kg] is the
      point's own mass, without its segments' share; a body's mass properties
      already include the points fixed to it. `drag_area` [m²] is the
      cross-sectional area `drag_coefficient` [-] refers to.
    allOf:
      - $ref: "#/definitions/table"
      - properties:
          headers:
            items:
              - const: name
              - const: type
              - const: body
              - const: pos_CAD
              - const: mass
              - const: drag_area
              - const: drag_coefficient
            minItems: 7
          data:
            items:
              type: array
              items:
                - $ref: "#/definitions/component_name"
                - $ref: "#/definitions/dynamics_type"
                - $ref: "#/definitions/optional_name"
                - $ref: "#/definitions/vec3"
                - $ref: "#/definitions/non_negative"
                - $ref: "#/definitions/non_negative"
                - $ref: "#/definitions/non_negative"
              minItems: 7

  segments:
    description: >
      Straight elastic elements between two points. `l0` [m] is the unstretched
      length and `unit_stiffness` [N] the axial stiffness times that length.
    allOf:
      - $ref: "#/definitions/table"
      - properties:
          headers:
            items:
              - const: name
              - const: points
              - const: l0
              - const: diameter
              - const: density
              - const: unit_stiffness
            minItems: 6
          data:
            items:
              type: array
              items:
                - $ref: "#/definitions/component_name"
                - $ref: "#/definitions/name_pair"
                - $ref: "#/definitions/length"
                - $ref: "#/definitions/length"
                - $ref: "#/definitions/density"
                - $ref: "#/definitions/rigidity"
              minItems: 6

  stations:
    description: >
      Groups of points sharing one twist degree of freedom. A station is a
      structural group, not an aerodynamic section: a wing is typically meshed
      into many more aerodynamic sections than it has stations, and the two must
      not be conflated.
    allOf:
      - $ref: "#/definitions/table"
      - properties:
          headers:
            items:
              - const: name
              - const: type
              - const: points
            minItems: 3
          data:
            items:
              type: array
              items:
                - $ref: "#/definitions/component_name"
                - $ref: "#/definitions/dynamics_type"
                - $ref: "#/definitions/name_list"
              minItems: 3

  pulleys:
    allOf:
      - $ref: "#/definitions/table"
      - properties:
          headers:
            items:
              - const: name
              - const: segments
              - const: type
              - const: efficiency
            minItems: 4
          data:
            items:
              type: array
              items:
                - $ref: "#/definitions/component_name"
                - $ref: "#/definitions/name_pair"
                - $ref: "#/definitions/dynamics_type"
                - $ref: "#/definitions/fraction"
              minItems: 4

  tethers:
    description: >
      Ordered runs of segments between two points. Material lives on the
      segments; a tether is the grouping a winch reels, and the length it is
      reeled from is its segments' `l0`.
    allOf:
      - $ref: "#/definitions/table"
      - properties:
          headers:
            items:
              - const: name
              - const: start_point
              - const: end_point
              - const: segments
            minItems: 4
          data:
            items:
              type: array
              items:
                - $ref: "#/definitions/component_name"
                - $ref: "#/definitions/component_name"
                - $ref: "#/definitions/component_name"
                - $ref: "#/definitions/name_list"
              minItems: 4

  winches:
    allOf:
      - $ref: "#/definitions/table"
      - properties:
          headers:
            items:
              - const: name
              - const: tethers
              - const: winch_point
              - const: gear_ratio
              - const: drum_radius
            minItems: 5
          data:
            items:
              type: array
              items:
                - $ref: "#/definitions/component_name"
                - $ref: "#/definitions/name_list"
                - $ref: "#/definitions/component_name"
                - $ref: "#/definitions/non_negative"
                - $ref: "#/definitions/length"
              minItems: 5

  # --------------------------------------------------------------------------
  # RIGID BODIES AND THE TUBES BETWEEN THEM
  # --------------------------------------------------------------------------
  bodies:
    description: >
      Rigid bodies. `pos_CAD` is the body's origin, which is its centre of mass,
      and `Q_KA_to_CAD` the rotation from its KA frame into CAD. That frame holds
      the axes `inertia_principal` is stated about, oriented as KiteUtils.jl
      orients `_KA` where the body has wing geometry and as its writer likes
      where it has no leading edge. `mass` [kg] and `inertia_principal` [kg·m²]
      are taken about that origin and already include the points fixed to the
      body; a tool that carries no rotational inertia writes zeros.
    allOf:
      - $ref: "#/definitions/table"
      - properties:
          headers:
            items:
              - const: name
              - const: type
              - const: pos_CAD
              - const: Q_KA_to_CAD
              - const: mass
              - const: inertia_principal
            minItems: 6
          data:
            items:
              type: array
              items:
                - $ref: "#/definitions/component_name"
                - $ref: "#/definitions/dynamics_type"
                - $ref: "#/definitions/vec3"
                - $ref: "#/definitions/quaternion"
                - $ref: "#/definitions/non_negative"
                - $ref: "#/definitions/vec3"
              minItems: 6

  tubes:
    description: >
      Inflated beam elements between two bodies, whose positions fix the
      element's ends and so its rest length. One `diameter` [m] holds for the
      whole element, and how it curves between those ends belongs to the
      element: only a shape its `law` cannot hold, or a taper, is a chain of
      tubes. `pressure` [Pa] is the inflation pressure and `law` names the
      stiffness law a reader derives the element's rigidities from.
    allOf:
      - $ref: "#/definitions/table"
      - properties:
          headers:
            items:
              - const: name
              - const: bodies
              - const: diameter
              - const: pressure
              - const: law
            minItems: 5
          data:
            items:
              type: array
              items:
                - $ref: "#/definitions/component_name"
                - $ref: "#/definitions/name_pair"
                - $ref: "#/definitions/length"
                - $ref: "#/definitions/non_negative"
                - $ref: "#/definitions/model_name"
              minItems: 5

additionalProperties: true

definitions:
  # ============================================================================
  # TABLES
  # ============================================================================
  table:
    description: >
      A headers/data block. Each block fixes the columns it requires as the
      leading headers and leaves the rest open, so a writer may append columns
      and an older reader still finds what it addresses by name. Every header is
      a string, and every row is exactly as long as the headers, which
      `rowsMatchHeaders` states and awesio.validator enforces.
    type: object
    required:
      - headers
      - data
    properties:
      headers:
        type: array
        items:
          type: string
      data:
        type: array
        items:
          type: array
    rowsMatchHeaders: true
    additionalProperties: false

  # ============================================================================
  # REFERENCES
  # ============================================================================
  component_name:
    description: >
      Name of a component in this document. Names are unique within their own
      block and are how every other block refers to it.
    type: string
    minLength: 1

  optional_name:
    description: A component name, or null where the component has no such link.
    oneOf:
      - $ref: "#/definitions/component_name"
      - type: "null"

  name_pair:
    description: The two components an element connects, as a two-element tuple.
    type: array
    items:
      $ref: "#/definitions/component_name"
    minItems: 2
    maxItems: 2

  name_list:
    description: Ordered component names, as referenced from another block.
    type: array
    items:
      $ref: "#/definitions/component_name"

  # ============================================================================
  # QUANTITIES
  # ============================================================================
  vec3:
    description: >
      A three-component vector in the frame its column's suffix names, in the
      units its column implies. CAD geometry is not a world position.
    type: array
    items:
      type: number
    minItems: 3
    maxItems: 3

  quaternion:
    description: >
      A unit quaternion, scalar first — `[w, x, y, z]` — rotating a vector from
      the frame its column names into the frame it names second.
    type: array
    items:
      type: number
    minItems: 4
    maxItems: 4

  length:
    type: number
    minimum: 0

  density:
    description: Material density [kg/m³].
    type: number
    minimum: 0

  non_negative:
    type: number
    minimum: 0

  fraction:
    type: number
    minimum: 0
    maximum: 1

  rigidity:
    description: >
      A stiffness or rigidity. A number is the linear value in the units its
      column names. A string names a nonlinear law that the reader resolves to
      a function of the corresponding strain, curvature or deflection; how such
      a law is defined is not yet part of this schema, so a file using one is
      portable only between readers that know the name.
    oneOf:
      - type: number
        minimum: 0
      - $ref: "#/definitions/model_name"

  model_name:
    description: >
      Name of a model or law the reader resolves to an implementation, rather
      than a component in this document.
    type: string
    minLength: 1

  dynamics_type:
    description: >
      The dynamic model governing a component. DYNAMIC components carry
      differential state and are solved by the dynamics; the others are
      prescribed, holding no state but mutable between steps.
    type: string
    enum:
      - DYNAMIC
      - STATIC
      - BODY_STATIC
      - KINEMATIC
