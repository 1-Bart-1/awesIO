# A file exercising every block of structure_schema.yml: a ground anchor, a
# three-segment tether, a control unit on the bridle, and one wing whose left
# and right leading-edge tubes are bodies, joined to each other and strutted
# back to the wing. It is illustrative, not a physical system; a worked kite
# follows once a writer emits conforming files.
metadata:
  name: minimal
  description: Minimal conforming resolved structure
  note: Illustrative only — the numbers are not a real system.
  awesIO_version: 1.0.0
  schema: structure_schema.yml
  n_points: 8
  connectivity_sha: "376c4d5a4455e7e0720bda55f0090342ca02801575236819f0b21f90f9abbccb"

