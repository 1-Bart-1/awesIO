metadata:
  name: v3_kite_beam
  description: "Resolved structure of the TU Delft V3 kite as V3Kite.jl's Timoshenko-beam project builds it: a bridle and tether on a leading-edge tube and struts of rigid bodies joined by tubes, with the canopy spread over them."
  note: "Written by OpenSourceAWE/KiteGeometry.jl@37d5c4d reading and writing, under OpenSourceAWE/SymbolicAWEModels.jl@e89cbb4, the files of OpenSourceAWE/V3Kite.jl@fd73944: `data/struc_geometry_beam.yaml` under `data/system_beam.yaml`, placed by KiteGeometry's `place!` at 90° elevation and 0° heading rather than V3Kite's 70°."
  awesIO_version: "0.1.0"
  schema: structure_schema.yml
  n_points: 220
