  headers: [name, law, parameters]
  units: [-, -, -]
  data:
    - [v3_beam_line, linear, {density: 970.0, youngs_modulus: 5.5e+10}]
    - [control_line, linear, {density: 724.0, youngs_modulus: 5.5e+10}]
    - [v3_canopy, membrane, {areal_density: 0.0, membrane_stiffness: 1000.0}]
    - [v3_tube, breukels2011, {C1: 6582.82, C2: -272.43, C3: 40852.38, C4: 14.31, C5: 271865251.42, C6: 215.93,
        C7: 14021.79, C8: -589.05, C9: 322.55, C10: 0.0239, C11: 5.3833, C12: 0.0461,
        C13: 1467.0, C14: 40.908, C15: -191.8, C16: 47.406, C17: -17703.0, C18: 358.05,
        C19: 0.0918}]

