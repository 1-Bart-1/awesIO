metadata:
  name: v3_kite_beam
  description: "Resolved structure of the TU Delft V3 kite as V3Kite.jl's Timoshenko-beam project builds it: the same bridle and tether on a leading-edge tube and struts of rigid bodies joined by tubes, under a massless frame carrying the canopy."
  note: "Not generated: converted onto structure schema 1.0.0 from the document SymbolicAWEModels.jl's save_structure_document wrote from OpenSourceAWE/V3Kite.jl@973a818a `data/system_beam.yaml`, with OpenSourceAWE/SymbolicAWEModels.jl@3e5c47fb. Tubes take V3Kite's 0.3 bar and Breukels' law, part bodies V3Kite's Q_b_to_w, and every position is moved so the KCU sits at the CAD origin. Regenerate it once the writer emits this schema."
  awesIO_version: 1.0.0
  schema: "structure_schema.yml"
  n_points: 220
  connectivity_sha: e2560a6e4eb98ad200bf26c60aa82d6c49ec4be366fd9e787b90d2baf11ee65b
  cad_origin: kcu

