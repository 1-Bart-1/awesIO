metadata:
  name: ram_air_kite
  description: "A double-skin ram-air kite of two cells: its canopy is a top skin, a bottom skin and three ribs, all faces over shared points, with no body and no tube."
  note: "Written by a one-off script that is not kept, as the smallest structure showing a double skin, and small enough to edit by hand."
  awesIO_version: 0.1.0
  schema: structure_schema.yml
  n_points: 15
  connectivity_sha: daea1bb1cf5754c1a6e0e74991749752701a63d51ed20cd7cb089c4b266b7667
  system: ../system_config/ram_air_system.yml
  system_sha: 8bc73afce7626068e63c28ca96e75b2c88ca95f3f69861db576abb3fb60d3fea

