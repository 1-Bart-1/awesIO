    - [left_top, false, null, [0.0, 2.0, 103.2]]
    - [left_tail, false, null, [1.0, 2.0, 103.0]]
    - [left_bottom, false, null, [0.0, 2.0, 102.8]]
    - [middle_nose, false, null, [-1.0, 0.0, 103.0]]
    - [middle_top, false, null, [0.0, 0.0, 103.2]]
    - [middle_tail, false, null, [1.0, 0.0, 103.0]]
    - [middle_bottom, false, null, [0.0, 0.0, 102.8]]
